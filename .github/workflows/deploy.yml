name: wxread

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  schedule:
    # cron 一律按 UTC，注释标注北京时间（UTC+8）
    - cron: '0 17 * * *'    # 北京次日 01:00 —— 主时段
    - cron: '30 21 * * *'   # 北京次日 05:30 —— 兜底
    - cron: '30 4 * * *'    # 北京 12:30 —— 兜底
    - cron: '30 10 * * *'   # 北京 18:30 —— 兜底
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: AutoRead
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check if already succeeded today (Beijing time)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 纯 epoch 算术换算北京时间，不解析日期字符串，避免时区/解析差异
          NOW=$(date -u +%s)
          CN_NOW=$((NOW + 28800))                      # UTC+8 的 epoch
          CN_DAY_START=$((CN_NOW - CN_NOW % 86400))    # 向下取整到北京当天 00:00
          SINCE_EPOCH=$((CN_DAY_START - 28800))        # 换回 UTC
          TODAY_CN=$(date -u -d "@${CN_DAY_START}" +%Y-%m-%d)
          SINCE=$(date -u -d "@${SINCE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)
          echo "北京今天: ${TODAY_CN}  |  统计起点(UTC): ${SINCE}"

          # 只统计"真正跑过"的成功运行：耗时 > 10 分钟
          # 原因：Skip 那次的结论也是 success（约 15 秒），不过滤会导致连环跳过
          N=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?created=>=${SINCE}&per_page=100" \
                --jq '[.workflow_runs[]
                       | select(.conclusion=="success")
                       | select(((.updated_at|fromdate) - (.created_at|fromdate)) > 600)
                      ] | length' 2>/dev/null || echo 0)
          echo "北京今天有效运行数(>10分钟): $N"
          echo "runs=$N" >> $GITHUB_OUTPUT

      - name: Skip (already done today)
        if: ${{ steps.check.outputs.runs != '0' }}
        run: echo "北京时间今天已完成，跳过本次触发。"

      - name: Checkout repository
        if: ${{ steps.check.outputs.runs == '0' }}
        uses: actions/checkout@v4

      - name: Set DNS to Google's DNS
        if: ${{ steps.check.outputs.runs == '0' }}
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf

      - name: Set up Python
        if: ${{ steps.check.outputs.runs == '0' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        if: ${{ steps.check.outputs.runs == '0' }}
        run: |
          python -m pip install --upgrade pip
          pip install certifi==2024.8.30 charset-normalizer==3.4.0 idna==3.10 requests==2.32.3 urllib3==2.2.3

      - name: Run deployment script
        if: ${{ steps.check.outputs.runs == '0' }}
        env:
          WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
          PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERVERCHAN_SPT: ${{ secrets.SERVERCHAN_SPT }}
          READ_NUM: ${{ vars.READ_NUM }}
        run: python main.py

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
