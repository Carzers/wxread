name: wxread

# 关键：改成 false。任务要跑 1 小时，多个 cron 若设为 true 会互相取消
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  schedule:
    # 北京时间 01:00 —— 主时段
    - cron: '0 17 * * *'
    # 北京时间 05:30 —— 兜底（与主时段间隔 4.5h，不会和 1h 的任务重叠）
    - cron: '30 21 * * *'
    # 北京时间 12:30 —— 第二道兜底
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: AutoRead
    permissions:
      actions: read    # 供 gh api 查询当天运行记录
      contents: read

    steps:
      - name: Check if already succeeded today
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          N=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?created=>=${TODAY}&per_page=100" \
                --jq '[.workflow_runs[] | select(.conclusion=="success")] | length' 2>/dev/null || echo 0)
          echo "今日已有成功运行数: $N"
          echo "runs=$N" >> $GITHUB_OUTPUT

      - name: Skip (already done today)
        if: ${{ steps.check.outputs.runs != '0' }}
        run: echo "今天已经成功跑过，跳过本次触发，避免重复阅读触发风控。"

      - name: Checkout repository
        if: ${{ steps.check.outputs.runs == '0' }}
        uses: actions/checkout@v4

      - name: Set DNS to Google's DNS
        if: ${{ steps.check.outputs.runs == '0' }}
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf

      - name: Set up Python
        if: ${{ steps.check.outputs.runs == '0' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        if: ${{ steps.check.outputs.runs == '0' }}
        run: |
          python -m pip install --upgrade pip
          pip install certifi==2024.8.30 charset-normalizer==3.4.0 idna==3.10 requests==2.32.3 urllib3==2.2.3

      - name: Run deployment script
        if: ${{ steps.check.outputs.runs == '0' }}
        env:
          WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
          PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERVERCHAN_SPT: ${{ secrets.SERVERCHAN_SPT }}
          READ_NUM: ${{ vars.READ_NUM }}
        run: python main.py

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
